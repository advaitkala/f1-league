name: Sync and score

on:
  schedule:
    # Every 3 hours Friday through Monday (UTC). The commands no-op when
    # there is nothing new, so a frequent schedule is safe.
    - cron: "0 */3 * * 5,6,0,1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync races and drivers
        run: python manage.py sync_f1

      - name: Sync results
        run: python manage.py sync_results

      - name: Score predictions
        run: python manage.py score_race
